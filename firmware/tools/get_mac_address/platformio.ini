; Signyales — MAC Address Utility
; Flash this TEMPORARILY onto the receiver ESP32 to read its MAC address,
; then flash receiver_firmware back on afterward. See firmware/receiver/README.md.
; Build/flash: pio run -t upload
; Read output: pio device monitor

[env:get_mac_address]
; Pinned to the platform version resolved on the dev machine (see `pio pkg list`; Arduino core 2.0.17).
; To upgrade, change this deliberately and rebuild all four firmware targets.
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
