; Signyales — Glove Hardware Check
; Flash this TEMPORARILY onto a glove to check its wiring: it prints all
; 7 flex readings, finds the motion sensor, and shows which flex pins
; stop working when Wi-Fi/ESP-NOW is on. Then flash the glove firmware
; back on. Sends nothing wirelessly. See firmware/glove/README.md.
; Build/flash: pio run -t upload
; Read output: pio device monitor

[env:glove_hw_check]
; Pinned to the platform version resolved on the dev machine (see `pio pkg list`; Arduino core 2.0.17).
; To upgrade, change this deliberately and rebuild all the firmware targets.
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
