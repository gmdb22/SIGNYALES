; Signyales — Glove Firmware (original ESP32: ESP32-DevKitC-32E clone, CP210x USB)
; Build/flash the left glove:  pio run -e left_glove -t upload
; Build/flash the right glove: pio run -e right_glove -t upload
; Serial monitor:              pio device monitor

[env]
; Pinned to the platform version resolved on the dev machine (see `pio pkg list`; Arduino core 2.0.17).
; To upgrade, change this deliberately and rebuild all four firmware targets.
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

[env:left_glove]
build_flags = -DIS_LEFT_GLOVE=1 -DIS_RIGHT_GLOVE=0

[env:right_glove]
build_flags = -DIS_LEFT_GLOVE=0 -DIS_RIGHT_GLOVE=1
